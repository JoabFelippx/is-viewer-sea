[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "is-viewer"
version = "2.2.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "is-msgs-sea>=1.3.0,<2",
  "is-wire-sea>=2.0.0,<3",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<6",
]

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["is_viewer*"]

[tool.setuptools.package-data]
"is_viewer.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/*.json"]

[tool.ruff]
line-length = 88
target-version = "py310"
