apiVersion: v1
kind: Service
metadata:
  name: is-viewer
spec:
  type: NodePort
  selector:
    app: is-viewer
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30301

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: is-viewer
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: is-viewer
  template:
    metadata:
      labels:
        app: is-viewer
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: viewer
          image: miguelgrigorio27/is-viewer:2.1.4@sha256:fde5c6236ee322bf5c6082a8e2c6da3b20efb1bd64a09b602dfddc1610fdcbde
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["server:app", "--host", "0.0.0.0", "--port", "3000"]
          env:
            - name: IS_URI
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-new-uri
                  key: uri
            - name: IS_PORT
              value: "3000"
            - name: CAMERA_TOPICS
              value: "CameraGateway.1.Frame,CameraGateway.2.Frame,CameraGateway.3.Frame,CameraGateway.4.Frame,CameraGateway.5.Frame"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
